<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jmeet</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- ==================== JOIN SCREEN ==================== -->
    <div id="joinScreen">
        <div id="topBar"><span class="brand" id="brand"></span></div>
        <div id="previewWrap">
            <video id="previewVideo" autoplay playsinline muted></video>
            <div id="previewMsg" class="hidden"></div>
        </div>
        <div id="joinBox">
            <h1>Ready to join?</h1>
            <p id="connStatus">Connecting to server...</p>
            <input type="text" id="nameInput" placeholder="Your name" maxlength="30" autocomplete="off" />
            <button id="joinBtn" class="pill-btn" disabled>Join now</button>
        </div>
    </div>

    <!-- ==================== CALL SCREEN ==================== -->
    <div id="callScreen" class="hidden">
        <div id="stage">
            <div id="grid"></div>
        </div>

        <aside id="chatPanel" class="hidden">
            <div id="chatHeader">
                <span>In-call messages</span>
                <button id="chatClose" title="Close">&times;</button>
            </div>
            <div id="chatNote">Messages can only be seen by people in the call and are deleted when the call ends.</div>
            <div id="chatLog"></div>
            <form id="chatForm" autocomplete="off">
                <input type="text" id="chatInput" placeholder="Send a message" maxlength="500" />
                <button type="submit" id="chatSend" title="Send" disabled>
                    <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
                </button>
            </form>
        </aside>

        <div id="controls">
            <div id="roomInfo"><b id="clock"></b> <span>| Jmeet</span></div>
            <div id="centerBtns">
                <button class="ctrl" id="micBtn" title="Turn off microphone"></button>
                <button class="ctrl" id="camBtn" title="Turn off camera"></button>
                <button class="ctrl" id="shareBtn" title="Present now"></button>
                <button class="ctrl leave" id="leaveBtn" title="Leave call"></button>
            </div>
            <div id="rightBtns">
                <button class="ctrl" id="chatBtn" title="Chat with everyone"></button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        // ==============================
        // ICONS
        // ==============================
        const ICONS = {
            logo: '<svg viewBox="0 0 40 32"><path class="logo-b" d="M0 8 8 0v8z"/><path class="logo-a" d="M0 8h8v16H0z"/><path class="logo-d" d="M0 24h8v8H2a2 2 0 0 1-2-2z"/><path class="logo-c" d="M8 0h18a2 2 0 0 1 2 2v6H8z"/><path class="logo-d" d="M8 24h20v6a2 2 0 0 1-2 2H8zM20 8h8v16h-8zM28 12l10-8v24l-10-8z"/></svg>',
            micOn: '<svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>',
            micOff: '<svg viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5a3 3 0 0 0-6 0v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11a3 3 0 0 0 3 3c.22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52a5 5 0 0 1-5-5H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/></svg>',
            camOn: '<svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>',
            camOff: '<svg viewBox="0 0 24 24"><path d="M21 6.5l-4 4V7a1 1 0 0 0-1-1H9.82L21 17.18V6.5zM3.27 2L2 3.27 4.73 6H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12c.21 0 .39-.08.54-.18L19.73 21 21 19.73 3.27 2z"/></svg>',
            share: '<svg viewBox="0 0 24 24"><path d="M20 18a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2H0v2h24v-2h-4zM4 6h16v10H4V6zm9 7.5V15l3-3-3-3v1.5c-3 .4-4.3 2.4-5 4.5 1.1-1.4 2.6-2 5-2z"/></svg>',
            leave: '<svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85a.98.98 0 0 1-.7.28.99.99 0 0 1-.71-.29L.29 13.08A.96.96 0 0 1 0 12.37c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48a.99.99 0 0 1-.71.29.98.98 0 0 1-.7-.28 11.27 11.27 0 0 0-2.67-1.85.99.99 0 0 1-.56-.9v-3.1A15.9 15.9 0 0 0 12 9z"/></svg>',
            chat: '<svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 14H5.17L4 17.17V4h16v12zM7 9h10v2H7zm0-3h10v2H7zm0 6h7v2H7z"/></svg>',
            micOffSmall: '<svg viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5a3 3 0 0 0-6 0v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11a3 3 0 0 0 3 3c.22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52a5 5 0 0 1-5-5H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/></svg>'
        };

        // ==============================
        // STATE
        // ==============================
        const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + (location.host || "localhost:8000");
        const RTC_CONFIG = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

        let socket = null;
        let myId = null;
        let myName = "";
        let inCall = false;
        let localStream = null;   // camera + mic
        let screenStream = null;  // screen share (when presenting)
        let audioOn = true;
        let videoOn = true;
        let unread = false;

        // peerId -> { pc, name, tile, pendingIce: [], audio, video }
        const peers = {};

        const $ = (id) => document.getElementById(id);

        // ==============================
        // HELPERS
        // ==============================
        function toast(text) {
            const t = $("toast");
            t.textContent = text;
            t.classList.add("show");
            clearTimeout(toast.timer);
            toast.timer = setTimeout(() => t.classList.remove("show"), 2500);
        }

        // The native http.dll crashes on WebSocket frames of roughly 8 KB+,
        // and WebRTC offers/answers are often bigger than that, so large
        // messages are split into small "chunk" messages and reassembled.
        const CHUNK_SIZE = 3000;
        const incomingChunks = {}; // "from:cid" -> { parts: [], received }

        function send(obj) {
            if (!socket || socket.readyState !== WebSocket.OPEN) return;
            obj.from = myId;
            const json = JSON.stringify(obj);
            if (json.length <= CHUNK_SIZE) {
                socket.send(json);
                return;
            }
            const cid = Math.random().toString(36).slice(2, 10);
            const n = Math.ceil(json.length / CHUNK_SIZE);
            for (let i = 0; i < n; i++) {
                const chunk = { type: "chunk", from: myId, cid, i, n,
                                data: json.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE) };
                if (obj.to !== undefined) chunk.to = obj.to;
                socket.send(JSON.stringify(chunk));
            }
        }

        // Returns the full message once every chunk has arrived, else null
        function collectChunk(msg) {
            const key = msg.from + ":" + msg.cid;
            const entry = incomingChunks[key] || (incomingChunks[key] = { parts: [], received: 0 });
            if (entry.parts[msg.i] === undefined) {
                entry.parts[msg.i] = msg.data;
                entry.received++;
            }
            if (entry.received < msg.n) return null;
            delete incomingChunks[key];
            try { return JSON.parse(entry.parts.join("")); } catch (e) { return null; }
        }

        function formatTime(ms) {
            return new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        }

        function updateClock() {
            $("clock").textContent = formatTime(Date.now());
        }

        // ==============================
        // VIDEO TILES
        // ==============================
        function createTile(id, name, isSelf) {
            const tile = document.createElement("div");
            tile.className = "tile" + (isSelf ? " self" : "");
            tile.dataset.id = id;

            const video = document.createElement("video");
            video.autoplay = true;
            video.playsInline = true;
            if (isSelf) video.muted = true; // never play back our own audio

            const avatar = document.createElement("div");
            avatar.className = "avatar";
            const initial = document.createElement("span");
            initial.textContent = (name || "?").charAt(0);
            avatar.appendChild(initial);

            const label = document.createElement("div");
            label.className = "label";
            const micOff = document.createElement("span");
            micOff.className = "mic-off";
            micOff.innerHTML = ICONS.micOffSmall;
            const nameSpan = document.createElement("span");
            nameSpan.className = "name";
            nameSpan.textContent = isSelf ? name + " (You)" : name;
            label.appendChild(micOff);
            label.appendChild(nameSpan);

            tile.appendChild(video);
            tile.appendChild(avatar);
            tile.appendChild(label);
            $("grid").appendChild(tile);
            layoutGrid();
            return tile;
        }

        function setTileName(tile, name) {
            tile.querySelector(".name").textContent = name;
            tile.querySelector(".avatar span").textContent = (name || "?").charAt(0);
        }

        function setTileMedia(tile, audio, video) {
            tile.classList.toggle("audio-off", !audio);
            tile.classList.toggle("video-off", !video);
        }

        function layoutGrid() {
            const n = $("grid").children.length;
            const cols = n <= 1 ? 1 : n <= 4 ? 2 : n <= 9 ? 3 : 4;
            $("grid").style.setProperty("--cols", cols);
        }

        // ==============================
        // MEDIA
        // ==============================
        async function getLocalMedia() {
            try {
                return await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            } catch (e) {
                try {
                    return await navigator.mediaDevices.getUserMedia({ audio: true });
                } catch (e2) {
                    return null;
                }
            }
        }

        function hasTrack(kind) {
            return !!(localStream && localStream.getTracks().some(t => t.kind === kind));
        }

        function updateControlButtons() {
            const mic = $("micBtn"), cam = $("camBtn");
            mic.innerHTML = audioOn ? ICONS.micOn : ICONS.micOff;
            mic.classList.toggle("off", !audioOn);
            mic.title = audioOn ? "Turn off microphone" : "Turn on microphone";
            cam.innerHTML = videoOn ? ICONS.camOn : ICONS.camOff;
            cam.classList.toggle("off", !videoOn);
            cam.title = videoOn ? "Turn off camera" : "Turn on camera";
            $("shareBtn").classList.toggle("active", !!screenStream);
            $("shareBtn").title = screenStream ? "Stop presenting" : "Present now";
        }

        function broadcastMediaState() {
            send({ type: "media", audio: audioOn, video: videoOn || !!screenStream });
        }

        function toggleMic() {
            if (!hasTrack("audio")) return toast("No microphone available");
            audioOn = !audioOn;
            localStream.getAudioTracks().forEach(t => t.enabled = audioOn);
            setTileMedia(peers.self.tile, audioOn, videoOn || !!screenStream);
            updateControlButtons();
            broadcastMediaState();
        }

        function toggleCam() {
            if (!hasTrack("video")) return toast("No camera available");
            videoOn = !videoOn;
            localStream.getVideoTracks().forEach(t => t.enabled = videoOn);
            setTileMedia(peers.self.tile, audioOn, videoOn || !!screenStream);
            updateControlButtons();
            broadcastMediaState();
        }

        // Swap the outgoing video track on every peer connection
        function replaceVideoTrack(track) {
            Object.keys(peers).forEach(id => {
                const p = peers[id];
                if (!p.pc) return;
                p.pc.getTransceivers().forEach(tr => {
                    if (tr.receiver.track && tr.receiver.track.kind === "video") {
                        tr.sender.replaceTrack(track).catch(() => {});
                    }
                });
            });
        }

        async function toggleShare() {
            if (screenStream) return stopShare();
            if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                return toast(window.isSecureContext ? "Screen sharing is not supported"
                                                    : "Screen sharing needs localhost or HTTPS");
            }
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            } catch (e) {
                return; // user cancelled
            }
            const track = screenStream.getVideoTracks()[0];
            track.onended = stopShare;
            replaceVideoTrack(track);
            const selfTile = peers.self.tile;
            selfTile.classList.add("screen");
            selfTile.querySelector("video").srcObject = screenStream;
            setTileMedia(selfTile, audioOn, true);
            updateControlButtons();
            broadcastMediaState();
            toast("You are presenting to everyone");
        }

        function stopShare() {
            if (!screenStream) return;
            screenStream.getTracks().forEach(t => t.stop());
            screenStream = null;
            const camTrack = localStream ? localStream.getVideoTracks()[0] || null : null;
            replaceVideoTrack(camTrack);
            const selfTile = peers.self.tile;
            selfTile.classList.remove("screen");
            selfTile.querySelector("video").srcObject = localStream;
            setTileMedia(selfTile, audioOn, videoOn);
            updateControlButtons();
            broadcastMediaState();
        }

        // ==============================
        // WEBRTC PEERS
        // ==============================
        function getOrCreatePeer(id, name) {
            let p = peers[id];
            if (p && p.pc) {
                if (name && name !== p.name) { p.name = name; setTileName(p.tile, name); }
                return p;
            }

            const pc = new RTCPeerConnection(RTC_CONFIG);
            p = peers[id] = {
                pc,
                name: name || "Guest",
                tile: createTile(id, name || "Guest", false),
                pendingIce: [],
                remoteStream: new MediaStream()
            };
            p.tile.querySelector("video").srcObject = p.remoteStream;

            pc.onicecandidate = (e) => {
                if (e.candidate) send({ type: "ice", to: id, candidate: e.candidate });
            };

            pc.ontrack = (e) => {
                p.remoteStream.addTrack(e.track);
                const v = p.tile.querySelector("video");
                v.srcObject = p.remoteStream;
                v.play().catch(() => {});
            };

            pc.onconnectionstatechange = () => {
                if (pc.connectionState === "failed" || pc.connectionState === "closed") {
                    removePeer(id);
                }
            };

            return p;
        }

        // Attach our outgoing tracks (or recv-only slots if we have no device)
        function addLocalTracks(pc, isOfferer) {
            const videoTrack = screenStream
                ? screenStream.getVideoTracks()[0]
                : (localStream ? localStream.getVideoTracks()[0] : null);
            const audioTrack = localStream ? localStream.getAudioTracks()[0] : null;
            const streamForTracks = localStream || new MediaStream();

            if (audioTrack) pc.addTrack(audioTrack, streamForTracks);
            else if (isOfferer) pc.addTransceiver("audio", { direction: "recvonly" });

            if (videoTrack) pc.addTrack(videoTrack, streamForTracks);
            else if (isOfferer) pc.addTransceiver("video", { direction: "recvonly" });
        }

        async function flushIce(p) {
            while (p.pendingIce.length) {
                const c = p.pendingIce.shift();
                try { await p.pc.addIceCandidate(c); } catch (e) { console.warn("ICE error", e); }
            }
        }

        // An existing participant calls the newcomer
        async function callPeer(id, name, audio, video) {
            const p = getOrCreatePeer(id, name);
            setTileMedia(p.tile, audio, video);
            addLocalTracks(p.pc, true);
            const offer = await p.pc.createOffer();
            await p.pc.setLocalDescription(offer);
            send({
                type: "offer", to: id, name: myName, sdp: p.pc.localDescription,
                audio: audioOn, video: videoOn || !!screenStream
            });
        }

        async function handleOffer(msg) {
            const p = getOrCreatePeer(msg.from, msg.name);
            setTileMedia(p.tile, msg.audio, msg.video);
            await p.pc.setRemoteDescription(msg.sdp);
            addLocalTracks(p.pc, false);
            await flushIce(p);
            const answer = await p.pc.createAnswer();
            await p.pc.setLocalDescription(answer);
            send({
                type: "answer", to: msg.from, name: myName, sdp: p.pc.localDescription,
                audio: audioOn, video: videoOn || !!screenStream
            });
        }

        async function handleAnswer(msg) {
            const p = peers[msg.from];
            if (!p || !p.pc) return;
            if (msg.name) setTileName(p.tile, msg.name), p.name = msg.name;
            setTileMedia(p.tile, msg.audio, msg.video);
            await p.pc.setRemoteDescription(msg.sdp);
            await flushIce(p);
        }

        async function handleIce(msg) {
            const p = peers[msg.from];
            if (!p || !p.pc) return;
            if (p.pc.remoteDescription) {
                try { await p.pc.addIceCandidate(msg.candidate); } catch (e) { console.warn("ICE error", e); }
            } else {
                p.pendingIce.push(msg.candidate);
            }
        }

        function removePeer(id) {
            const p = peers[id];
            if (!p || id === "self") return;
            try { p.pc.close(); } catch (e) {}
            p.tile.remove();
            delete peers[id];
            layoutGrid();
            if (inCall) addSystemMessage(p.name + " left the call");
        }

        // ==============================
        // CHAT
        // ==============================
        function addChatMessage(name, text, time, mine) {
            const log = $("chatLog");
            const el = document.createElement("div");
            el.className = "msg";
            const meta = document.createElement("div");
            meta.className = "meta";
            meta.textContent = mine ? "You" : name;
            const t = document.createElement("time");
            t.textContent = formatTime(time);
            meta.appendChild(t);
            const body = document.createElement("div");
            body.className = "text";
            body.textContent = text;
            el.appendChild(meta);
            el.appendChild(body);
            log.appendChild(el);
            log.scrollTop = log.scrollHeight;

            if (!mine && $("chatPanel").classList.contains("hidden")) {
                setUnread(true);
                toast(name + ": " + text);
            }
        }

        function addSystemMessage(text) {
            const log = $("chatLog");
            const el = document.createElement("div");
            el.className = "msg system";
            el.textContent = text;
            log.appendChild(el);
            log.scrollTop = log.scrollHeight;
        }

        function setUnread(value) {
            unread = value;
            const btn = $("chatBtn");
            let badge = btn.querySelector(".badge");
            if (value && !badge) {
                badge = document.createElement("span");
                badge.className = "badge";
                btn.appendChild(badge);
            } else if (!value && badge) {
                badge.remove();
            }
        }

        function toggleChat(force) {
            const panel = $("chatPanel");
            const show = typeof force === "boolean" ? force : panel.classList.contains("hidden");
            panel.classList.toggle("hidden", !show);
            $("chatBtn").classList.toggle("active", show);
            if (show) {
                setUnread(false);
                $("chatInput").focus();
            }
        }

        function sendChat(e) {
            e.preventDefault();
            const input = $("chatInput");
            const text = input.value.trim();
            if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;
            const time = Date.now();
            send({ type: "chat", name: myName, text, time });
            addChatMessage(myName, text, time, true);
            input.value = "";
            $("chatSend").disabled = true;
        }

        // ==============================
        // WEBSOCKET
        // ==============================
        function connect() {
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                $("connStatus").textContent = "Connected to " + wsUrl;
            };

            socket.onmessage = (event) => {
                const data = String(event.data);

                // Plain-text control messages from app.bzg
                if (data.startsWith("__id__:")) {
                    myId = data.slice(7).trim();
                    $("joinBtn").disabled = false;
                    return;
                }
                if (data.startsWith("__left__:")) {
                    removePeer(data.slice(9).trim());
                    return;
                }

                let msg;
                try { msg = JSON.parse(data); } catch (e) { return; }
                if (!msg || !msg.type) return;
                if (String(msg.from) === String(myId)) return;          // our own echo
                if (msg.to !== undefined && String(msg.to) !== String(myId)) return; // not for us
                if (!inCall) return;

                if (msg.type === "chunk") {
                    msg = collectChunk(msg);
                    if (!msg) return;
                }

                handleMessage(msg).catch(err => console.error("Signaling error", err));
            };

            socket.onclose = () => {
                $("connStatus").textContent = "Disconnected from server";
                $("joinBtn").disabled = true;
                $("chatSend").disabled = true;
                if (inCall) toast("Lost connection to the server");
            };

            socket.onerror = () => {
                $("connStatus").textContent = "Could not reach " + wsUrl;
            };
        }

        async function handleMessage(msg) {
            const from = String(msg.from);
            switch (msg.type) {
                case "join":
                    addSystemMessage(msg.name + " joined the call");
                    toast(msg.name + " joined");
                    await callPeer(from, msg.name, msg.audio, msg.video);
                    break;
                case "offer":
                    await handleOffer(msg);
                    break;
                case "answer":
                    await handleAnswer(msg);
                    break;
                case "ice":
                    await handleIce(msg);
                    break;
                case "media":
                    if (peers[from]) setTileMedia(peers[from].tile, msg.audio, msg.video);
                    break;
                case "chat":
                    addChatMessage(msg.name, msg.text, msg.time || Date.now(), false);
                    break;
                case "leave":
                    removePeer(from);
                    break;
            }
        }

        // ==============================
        // JOIN / LEAVE
        // ==============================
        async function initPreview() {
            localStream = await getLocalMedia();
            const msg = $("previewMsg");
            if (!localStream) {
                msg.textContent = window.isSecureContext
                    ? "Camera and microphone are unavailable. You can still join and chat."
                    : "The browser blocks the camera on plain http:// (except localhost). " +
                      "You can still join, see others and chat.";
                msg.classList.remove("hidden");
            } else {
                $("previewVideo").srcObject = localStream;
                if (!hasTrack("video")) {
                    msg.textContent = "Camera is unavailable (microphone only).";
                    msg.classList.remove("hidden");
                }
            }
            audioOn = hasTrack("audio");
            videoOn = hasTrack("video");
        }

        function joinCall() {
            myName = $("nameInput").value.trim() || "Guest " + myId;
            inCall = true;

            $("joinScreen").classList.add("hidden");
            $("callScreen").classList.remove("hidden");

            // Our own tile
            const selfTile = createTile("self", myName, true);
            selfTile.querySelector("video").srcObject = localStream;
            peers.self = { tile: selfTile, name: myName };
            setTileMedia(selfTile, audioOn, videoOn);
            updateControlButtons();
            $("chatSend").disabled = true;

            addSystemMessage("You joined the call");
            send({ type: "join", name: myName, audio: audioOn, video: videoOn });
        }

        function leaveCall() {
            send({ type: "leave" });
            inCall = false;
            Object.keys(peers).forEach(id => { if (id !== "self") removePeer(id); });
            if (screenStream) screenStream.getTracks().forEach(t => t.stop());
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (socket) socket.close();
            document.body.innerHTML =
                '<div class="center-screen">' +
                '<span class="brand">' + ICONS.logo + '<b>Jmeet</b></span>' +
                '<h1>You left the meeting</h1>' +
                '<button class="pill-btn" onclick="location.reload()">Rejoin</button>' +
                '</div>';
        }

        // ==============================
        // WIRE UP UI
        // ==============================
        $("joinBtn").addEventListener("click", joinCall);
        $("nameInput").addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !$("joinBtn").disabled) joinCall();
        });
        $("micBtn").addEventListener("click", toggleMic);
        $("camBtn").addEventListener("click", toggleCam);
        $("shareBtn").addEventListener("click", toggleShare);
        $("leaveBtn").addEventListener("click", leaveCall);
        $("chatBtn").addEventListener("click", () => toggleChat());
        $("chatClose").addEventListener("click", () => toggleChat(false));
        $("chatForm").addEventListener("submit", sendChat);
        $("chatInput").addEventListener("input", () => {
            $("chatSend").disabled = $("chatInput").value.trim().length === 0;
        });
        window.addEventListener("beforeunload", () => { if (inCall) send({ type: "leave" }); });

        $("brand").innerHTML = ICONS.logo + "<b>Jmeet</b>";
        $("shareBtn").innerHTML = ICONS.share;
        $("leaveBtn").innerHTML = ICONS.leave;
        $("chatBtn").innerHTML = ICONS.chat;
        updateClock();
        setInterval(updateClock, 15000);

        initPreview();
        connect();
    </script>
</body>
</html>
